name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so changesets can generate changelogs with the
          # correct commits.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # changeset publish shells out to npm, which handles the OIDC token
      # exchange with the registry (npm >= 11.5.1, bundled with Node 24).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Create Release PR or publish
        uses: changesets/action@v2
        with:
          # changesets/action v2 renamed these inputs.
          pr-title: Release Tracking
          version-script: bun run changeset:version
          publish-script: bun run release
        env:
          # Read by @changesets/changelog-github, not by the action itself:
          # v2 takes its own token through the github-token input, which
          # defaults to the workflow token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
